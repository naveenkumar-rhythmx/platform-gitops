# AppProject: proj-applications
# Business workloads on development / qa / production only.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: proj-applications
  namespace: argocd
  labels:
    app.kubernetes.io/name: proj-applications
    app.kubernetes.io/component: appproject
    app.kubernetes.io/part-of: rhythmx-platform
    platform.rhythmx.io/owner: application-teams
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Business microservices across workload clusters.
  sourceRepos:
    - https://github.com/naveenkumar-rhythmx/platform-helm-charts.git
    - https://github.com/naveenkumar-rhythmx/application-config.git
  destinations:
    - name: development
      namespace: "apps-*"
    - name: qa
      namespace: "apps-*"
    - name: production
      namespace: "apps-*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: ReplicaSet
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: networking.k8s.io
      kind: Ingress
    - group: policy
      kind: PodDisruptionBudget
    - group: argoproj.io
      kind: Rollout
    - group: monitoring.coreos.com
      kind: ServiceMonitor
  roles:
    - name: app-developer
      policies:
        - p, proj:proj-applications:app-developer, applications, get, proj-applications/*, allow
        - p, proj:proj-applications:app-developer, applications, sync, proj-applications/*, allow
      groups:
        - rhythmx-app-developers
    - name: payments-team
      policies:
        - p, proj:proj-applications:payments-team, applications, get, proj-applications/payment*, allow
        - p, proj:proj-applications:payments-team, applications, sync, proj-applications/payment*, allow
        - p, proj:proj-applications:payments-team, applications, get, proj-applications/billing*, allow
      groups:
        - rhythmx-payments-team
  syncWindows:
    - kind: allow
      schedule: "* * * * *"
      duration: 24h
      clusters:
        - development
        - qa
      manualSync: true
    - kind: allow
      schedule: "0 10 * * 1-4"
      duration: 6h
      clusters:
        - production
      manualSync: true
