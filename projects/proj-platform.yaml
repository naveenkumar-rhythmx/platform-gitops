# AppProject: proj-platform
#
# Scope: platform addons that are important but not on the critical ingress
# path — policy engine (Kyverno), observability stack (kube-prometheus-stack,
# Loki, Tempo/Jaeger, OpenTelemetry Collector). Cluster-scoped resources are
# allowed for policy/CRD installation but narrower than proj-infrastructure.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: proj-platform
  namespace: argocd
  labels:
    app.kubernetes.io/name: proj-platform
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: appproject
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
    platform.rhythmx.io/environment: platform
    platform.rhythmx.io/owner: platform-engineering
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: >-
    Platform addons: policy-as-code (Kyverno) and observability
    (kube-prometheus-stack, Grafana, Loki, Tempo, OTel Collector). Owned by
    Platform Engineering; policy content co-owned by Security Architecture.

  sourceRepos:
    - https://github.com/naveenkumar-rhythmx/platform-gitops.git
    - https://github.com/naveenkumar-rhythmx/platform-helm-charts.git
    - https://kyverno.github.io/kyverno/
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts

  destinations:
    - server: https://kubernetes.default.svc
      namespace: kyverno
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: logging
    - server: https://kubernetes.default.svc
      namespace: tracing
    - server: https://kubernetes.default.svc
      namespace: platform-*

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: kyverno.io
      kind: ClusterPolicy
    - group: kyverno.io
      kind: ClusterPolicyReport
    - group: monitoring.coreos.com
      kind: ClusterRoleBinding
    - group: scheduling.k8s.io
      kind: PriorityClass

  roles:
    - name: platform-admin
      description: Full sync/manage rights over platform addon Applications.
      policies:
        - p, proj:proj-platform:platform-admin, applications, *, proj-platform/*, allow
      groups:
        - rhythmx-platform-engineering

    - name: security-reviewer
      description: Read-only + policy report visibility for Security Architecture.
      policies:
        - p, proj:proj-platform:security-reviewer, applications, get, proj-platform/*, allow
      groups:
        - rhythmx-security-architecture

  # Applications generated by app-of-apps/applicationset-platform.yaml are
  # named "<env>-platform" (e.g. dev-platform, prod-platform).
  syncWindows:
    - kind: allow
      schedule: "* * * * *"
      duration: 24h
      applications:
        - "dev-*"
        - "qa-*"
      manualSync: true
    - kind: allow
      schedule: "0 6 * * 1-5"
      duration: 12h
      applications:
        - "prod-*"
      manualSync: true
