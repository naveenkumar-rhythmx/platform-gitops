# AppProject: proj-platform
# Management-plane apps on the hub (root App-of-Apps, ApplicationSets, hub markers).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: proj-platform
  namespace: argocd
  labels:
    app.kubernetes.io/name: proj-platform
    app.kubernetes.io/component: appproject
    app.kubernetes.io/part-of: rhythmx-platform
    platform.rhythmx.io/owner: platform-engineering
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Platform control-plane applications (App-of-Apps, hub bootstrap).
  sourceRepos:
    - https://github.com/naveenkumar-rhythmx/platform-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: platform
    - name: development
      namespace: platform-system
    - name: qa
      namespace: platform-system
    - name: production
      namespace: platform-system
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: ApplicationSet
    - group: argoproj.io
      kind: AppProject
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  roles:
    - name: platform-admin
      description: Full sync on platform project
      policies:
        - p, proj:proj-platform:platform-admin, applications, *, proj-platform/*, allow
        - p, proj:proj-platform:platform-admin, applicationsets, *, proj-platform/*, allow
      groups:
        - rhythmx-platform-admins
