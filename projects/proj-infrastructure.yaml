# AppProject: proj-infrastructure
# Foundational addons — Phase 4 targets hub (in-cluster) primarily.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: proj-infrastructure
  namespace: argocd
  labels:
    app.kubernetes.io/name: proj-infrastructure
    app.kubernetes.io/component: appproject
    app.kubernetes.io/part-of: rhythmx-platform
    platform.rhythmx.io/owner: platform-engineering
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Ingress, cert-manager, metrics-server, ESO, network baseline.
  sourceRepos:
    - https://github.com/naveenkumar-rhythmx/platform-gitops.git
    - https://kubernetes.github.io/ingress-nginx
    - https://charts.jetstack.io
    - https://charts.external-secrets.io
    - https://kubernetes-sigs.github.io/metrics-server/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  roles:
    - name: infra-admin
      policies:
        - p, proj:proj-infrastructure:infra-admin, applications, *, proj-infrastructure/*, allow
      groups:
        - rhythmx-platform-admins
