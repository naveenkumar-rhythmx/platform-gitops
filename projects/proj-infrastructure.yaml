# AppProject: proj-infrastructure
#
# Scope: cluster-foundational addons that every workload depends on
# (ingress-nginx, cert-manager, external-secrets, metrics-server, and the
# network/priority/quota baseline). Highest blast radius if misconfigured —
# cluster-scoped resources are allowed here, but narrowly, and only the
# resource kinds actually needed by these addons (CRDs, ClusterRoles,
# ClusterIssuers, etc.), never a wildcard "*" cluster-scope allow.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: proj-infrastructure
  namespace: argocd
  labels:
    app.kubernetes.io/name: proj-infrastructure
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: appproject
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
    platform.rhythmx.io/environment: platform
    platform.rhythmx.io/owner: platform-engineering
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: >-
    Cluster-foundational infrastructure addons (ingress, TLS, secrets sync,
    metrics, network baseline). Owned by Platform Engineering; changes to
    ClusterRole/ClusterIssuer-granting manifests require Security review.

  sourceRepos:
    - https://github.com/naveenkumar-rhythmx/platform-gitops.git
    - https://github.com/naveenkumar-rhythmx/platform-helm-charts.git
    # Upstream OCI/Helm registries for third-party addon charts:
    - https://kubernetes.github.io/ingress-nginx
    - https://charts.jetstack.io
    - https://charts.external-secrets.io
    - https://kubernetes-sigs.github.io/metrics-server/

  destinations:
    - server: https://kubernetes.default.svc
      namespace: ingress-nginx
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: metrics-server
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: network-policies

  # Cluster-scoped resource kinds required by infra addons ONLY — no
  # wildcard. Anything not listed here (e.g. ClusterRoleBinding to
  # cluster-admin, PodSecurityPolicy) is denied by default.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: networking.k8s.io
      kind: IngressClass
    - group: scheduling.k8s.io
      kind: PriorityClass
    - group: apiregistration.k8s.io
      kind: APIService

  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota # infra namespaces are not subject to app-tier quotas
    - group: ""
      kind: LimitRange

  roles:
    - name: infra-admin
      description: Full sync/manage rights over infrastructure Applications.
      policies:
        - p, proj:proj-infrastructure:infra-admin, applications, *, proj-infrastructure/*, allow
      groups:
        - rhythmx-platform-engineering

    - name: infra-viewer
      description: Read-only visibility for SRE/on-call.
      policies:
        - p, proj:proj-infrastructure:infra-viewer, applications, get, proj-infrastructure/*, allow
      groups:
        - rhythmx-sre-oncall

  # Applications generated by app-of-apps/applicationset-infrastructure.yaml
  # are named "<env>-infrastructure" (e.g. dev-infrastructure,
  # prod-infrastructure), so windows are scoped by that naming convention.
  syncWindows:
    - kind: allow
      schedule: "* * * * *"
      duration: 24h
      applications:
        - "dev-*"
        - "qa-*"
      manualSync: true
    - kind: allow
      schedule: "0 6 * * 1-5"
      duration: 12h
      applications:
        - "prod-*"
      manualSync: true
