# Per-environment metadata consumed by app-of-apps/applicationset-infrastructure.yaml
# via an Argo CD ApplicationSet git "files" generator.
#
# qa: a dedicated cluster in real deployments. Placeholder API server below
# until the cluster is registered with:
#   argocd cluster add <qa-kubeconfig-context> --name qa-cluster
# Until registered, the generated "qa-infrastructure" Application will show
# as Unknown/ComparisonError — this is expected for a not-yet-provisioned
# environment and does not block dev.
env: qa
server: https://qa-cluster-api.platform.local:6443
clusterLabel: rhythmx-qa
