# qa-infrastructure: Argo CD Application source path (see
# app-of-apps/applicationset-infrastructure.yaml). Requires
# `kustomize.buildOptions: --enable-helm` (argocd/install/values.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces.yaml
  - ../../../infrastructure/cert-manager/cluster-issuers.yaml
  - ../../../infrastructure/external-secrets/cluster-secret-store.yaml
  # external-secret-examples.yaml is DEV-ONLY (see clusters/dev/infrastructure/
  # kustomization.yaml) — it hardcodes apps-*-dev namespaces as onboarding
  # reference examples and is not meant to be triplicated per environment.
  - ../../../infrastructure/priority-classes/priority-classes.yaml
  # NOTE: infrastructure/resource-quotas/quota-template.yaml and
  # infrastructure/network-policies/{default-deny,allow-dns}.yaml are
  # PATTERN/TEMPLATE references (placeholder namespace), not applied
  # directly — concrete per-namespace instantiations for this environment
  # live in ../apps/quotas.yaml and ../apps/network-policies.yaml,
  # included below via `../apps`.
  - ../apps

helmCharts:
  - name: ingress-nginx
    repo: https://kubernetes.github.io/ingress-nginx
    version: 4.15.1 # app version 1.15.1
    releaseName: ingress-nginx
    namespace: ingress-nginx
    valuesFile: ingress-nginx-values.yaml

  - name: cert-manager
    repo: https://charts.jetstack.io
    version: 1.21.0
    releaseName: cert-manager
    namespace: cert-manager
    valuesFile: ../../../infrastructure/cert-manager/values-qa.yaml

  - name: external-secrets
    repo: https://charts.external-secrets.io
    version: 2.8.0
    releaseName: external-secrets
    namespace: external-secrets
    valuesFile: ../../../infrastructure/external-secrets/values-qa.yaml

  - name: metrics-server
    repo: https://kubernetes-sigs.github.io/metrics-server/
    version: 3.13.1 # app version 0.8.1
    releaseName: metrics-server
    namespace: metrics-server
    valuesFile: ../../../infrastructure/metrics-server/values-qa.yaml

patches:
  - target:
      kind: Namespace
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-1"
  - target:
      kind: ClusterIssuer
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "2"
  - target:
      kind: ClusterSecretStore
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "2"
