# default-deny-all + allow-dns for every qa app namespace, instantiated
# from infrastructure/network-policies/{default-deny,allow-dns}.yaml. Real
# enforcement here (qa runs a policy-enforcing CNI). See
# infrastructure/network-policies/default-deny.yaml for full rationale.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: apps-api-qa
  labels:
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
    platform.rhythmx.io/environment: qa
    platform.rhythmx.io/owner: platform-engineering
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: apps-api-qa
  labels:
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
    platform.rhythmx.io/environment: qa
    platform.rhythmx.io/owner: platform-engineering
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
