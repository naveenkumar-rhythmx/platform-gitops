# Application namespaces for qa. PSA restricted (matches prod posture so
# violations surface before promotion).
apiVersion: v1
kind: Namespace
metadata:
  name: apps-api-qa
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: apps-api-qa
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
    platform.rhythmx.io/environment: qa
    platform.rhythmx.io/owner: app-teams
    pod-security.kubernetes.io/enforce: restricted
---
