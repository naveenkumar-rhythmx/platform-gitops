# Namespaces for the qa environment/cluster. See clusters/dev/namespace.yaml
# for the full rationale (PSA levels, sync-wave ordering, live-Application
# split). QA tightens app namespaces to `restricted` PSA (closer to prod)
# to catch Pod Security violations before they reach prod.
---
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
  labels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
    platform.rhythmx.io/environment: qa
    platform.rhythmx.io/owner: platform-engineering
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/instance: cert-manager
