# Application namespaces for prod. `restricted` PSA, no exceptions.
apiVersion: v1
kind: Namespace
metadata:
  name: apps-api-prod
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: apps-api-prod
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
    platform.rhythmx.io/environment: prod
    platform.rhythmx.io/owner: app-teams
    pod-security.kubernetes.io/enforce: restricted
---
