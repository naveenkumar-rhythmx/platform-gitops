# ResourceQuota + LimitRange for every prod app namespace, instantiated from
# infrastructure/resource-quotas/quota-template.yaml. Prod sizing is the
# strictest of the three environments — teams request quota increases via
# PR (see infrastructure/resource-quotas/quota-template.yaml comments).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-quota
  namespace: apps-api-prod
  labels:
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
    platform.rhythmx.io/environment: prod
    platform.rhythmx.io/owner: platform-engineering
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "25"
    persistentvolumeclaims: "6"
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: apps-api-prod
  labels:
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
    platform.rhythmx.io/environment: prod
    platform.rhythmx.io/owner: platform-engineering
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 200m
        memory: 256Mi
      max:
        cpu: "4"
        memory: 8Gi
---
