# Per-environment metadata consumed by app-of-apps/applicationset-infrastructure.yaml
# via an Argo CD ApplicationSet git "files" generator. Keep this file tiny and
# flat — every key becomes a template parameter ({{env}}, {{server}}, ...).
#
# dev: the Kind bootstrap sandbox cluster IS the dev cluster (Argo CD runs
# in-cluster here), so server is the in-cluster API endpoint.
env: dev
server: https://kubernetes.default.svc
clusterLabel: rhythmx-gitops
