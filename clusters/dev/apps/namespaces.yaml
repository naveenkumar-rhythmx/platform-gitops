# Application namespaces for dev, one per service in
# application-config/apps/*. Namespace + quota + network-policy lifecycle is
# owned by Platform Engineering (this Application, sourced from
# proj-infrastructure); workload resources inside these namespaces are owned
# by proj-applications Applications generated from
# app-of-apps/applicationset-workloads.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: apps-api-dev
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: apps-api-dev
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
    platform.rhythmx.io/environment: dev
    platform.rhythmx.io/owner: app-teams
    pod-security.kubernetes.io/enforce: baseline
---
