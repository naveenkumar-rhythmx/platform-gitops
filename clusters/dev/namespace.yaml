# Namespaces for the dev environment/cluster. Applied at sync-wave "-1" so
# they (and their Pod Security Admission labels) exist before any
# infrastructure/platform/workload Application lands resources into them.
# CreateNamespace=true is ALSO set on every Application as a safety net,
# but explicit Namespace objects here are required to carry PSA + platform
# labels (CreateNamespace=true only creates a bare namespace).
#
# PSA levels (see policies/pod-security/namespace-labels.yaml for the full
# enforce/audit/warn matrix):
#   - infra/platform namespaces: privileged (ingress-nginx, cert-manager,
#     metrics-server need hostPort/hostNetwork-adjacent capabilities)
#   - app namespaces: restricted (dev slightly relaxed to baseline to
#     unblock early iteration; qa/prod are restricted)
---
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
  labels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
    platform.rhythmx.io/environment: dev
    platform.rhythmx.io/owner: platform-engineering
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/instance: cert-manager
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
    platform.rhythmx.io/environment: dev
    platform.rhythmx.io/owner: platform-engineering
    pod-security.kubernetes.io/enforce: restricted
---
