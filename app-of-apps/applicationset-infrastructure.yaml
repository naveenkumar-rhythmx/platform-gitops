# ApplicationSet: infrastructure (hub)
#
# GENERATOR: list (single hub destination)
# WHY not cluster generator for infra yet:
#   Centralized model — ingress/cert-manager/ESO run on the MANAGEMENT cluster
#   in Phase 4 (shared edge). Workload clusters stay app-only.
#   Swap to clusters generator if you later install ingress per workload cluster.
#
# Sync is MANUAL until Phase 4 installs real addon values.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
  labels:
    app.kubernetes.io/name: infrastructure
    app.kubernetes.io/component: applicationset
    platform.rhythmx.io/owner: platform-engineering
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - name: hub-infrastructure
            server: https://kubernetes.default.svc
            path: clusters/platform/infrastructure
  template:
    metadata:
      name: "{{.name}}"
      labels:
        app.kubernetes.io/component: infrastructure
        platform.rhythmx.io/environment: platform
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: proj-infrastructure
      source:
        repoURL: https://github.com/naveenkumar-rhythmx/platform-gitops.git
        targetRevision: main
        path: "{{.path}}"
      destination:
        server: "{{.server}}"
        namespace: default
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
