# Root App-of-Apps — single manual apply; everything else is GitOps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  labels:
    app.kubernetes.io/name: root-app
    app.kubernetes.io/component: app-of-apps
    app.kubernetes.io/part-of: rhythmx-platform
    platform.rhythmx.io/owner: platform-engineering
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: proj-platform
  source:
    repoURL: https://github.com/naveenkumar-rhythmx/platform-gitops.git
    targetRevision: main
    path: app-of-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /status
    - group: argoproj.io
      kind: ApplicationSet
      jsonPointers:
        - /status
