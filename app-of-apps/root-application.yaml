# Root "app of apps" — the single Application applied manually during
# bootstrap (see bootstrap/scripts/03-bootstrap-root-app.sh). It points at
# THIS directory (app-of-apps/) via Kustomize, which in turn contains the
# three top-level ApplicationSets (infrastructure, platform, workloads).
# Everything downstream is reconciled automatically from Git — no further
# manual `kubectl apply` is required after this.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  labels:
    app.kubernetes.io/name: root-app
    app.kubernetes.io/instance: root-app
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: app-of-apps
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
    platform.rhythmx.io/environment: platform
    platform.rhythmx.io/owner: platform-engineering
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/naveenkumar-rhythmx/platform-gitops.git
    targetRevision: main
    path: app-of-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /status
    - group: argoproj.io
      kind: ApplicationSet
      jsonPointers:
        - /status
