# ApplicationSet: workloads
#
# GENERATORS (matrix):
#   1) list  — explicit env → overlay → Argo cluster name mapping
#   2) git directories — every apps/* folder in application-config
#
# WHY matrix > static Applications:
#   - New service directory in Git ⇒ Apps for all envs appear automatically
#   - New environment row in the list ⇒ every service gains that env
#   - No N×M YAML explosion; generators are the Fortune 500 pattern
#
# MERGE note: merge generator is for combining independent generators that
# share a key (e.g. cluster metadata + git). We use matrix here because every
# (env × service) pair is required.
#
# CLUSTER generator alternative: selector on workload labels — used in
# applicationset-cluster-bootstrap.yaml. Workloads need overlay mapping
# (development→dev), so list+matrix is clearer.
#
# Phase 3: Applications are GENERATED; automated sync enabled for development
# only via progressive RollingSync. qa/prod remain gated (manual until Phase 5
# hardens charts/images). Actually RollingSync still auto-syncs — for Phase 3
# we disable automated sync entirely so UI shows Created apps; enable in Phase 5.
#
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads
  namespace: argocd
  labels:
    app.kubernetes.io/name: workloads
    app.kubernetes.io/component: applicationset
    platform.rhythmx.io/owner: platform-engineering
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - env: development
                  overlay: dev
                  cluster: development
                - env: qa
                  overlay: qa
                  cluster: qa
                - env: production
                  overlay: prod
                  cluster: production
          - git:
              repoURL: https://github.com/naveenkumar-rhythmx/application-config.git
              revision: main
              directories:
                - path: "apps/*"
  template:
    metadata:
      name: "{{.overlay}}-{{.path.basename}}"
      labels:
        app.kubernetes.io/name: "{{.path.basename}}"
        app.kubernetes.io/instance: "{{.overlay}}-{{.path.basename}}"
        app.kubernetes.io/component: workload
        app.kubernetes.io/part-of: rhythmx-platform
        platform.rhythmx.io/environment: "{{.env}}"
        platform.rhythmx.io/overlay: "{{.overlay}}"
        platform.rhythmx.io/owner: application-teams
      annotations:
        argocd.argoproj.io/sync-wave: "10"
    spec:
      project: proj-applications
      sources:
        - repoURL: https://github.com/naveenkumar-rhythmx/platform-helm-charts.git
          targetRevision: main
          path: "charts/{{.path.basename}}"
          helm:
            releaseName: "{{.path.basename}}"
            valueFiles:
              - "$values/apps/{{.path.basename}}/base/values.yaml"
              - "$values/apps/{{.path.basename}}/overlays/{{.overlay}}/values.yaml"
        - repoURL: https://github.com/naveenkumar-rhythmx/application-config.git
          targetRevision: main
          ref: values
      destination:
        name: "{{.cluster}}"
        namespace: "apps-{{.path.basename}}-{{.overlay}}"
      # Phase 3: generate only — enable automated sync in Phase 5 after images/charts verified
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
        - group: ""
          kind: Service
          jsonPointers:
            - /spec/clusterIP
            - /spec/clusterIPs
