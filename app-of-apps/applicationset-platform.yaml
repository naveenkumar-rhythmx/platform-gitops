# ApplicationSet: platform addons (security/observability on hub)
# GENERATOR: git files — discovers clusters/*/platform/env.yaml
# Manual sync until Phase 4.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-addons
  namespace: argocd
  labels:
    app.kubernetes.io/name: platform-addons
    app.kubernetes.io/component: applicationset
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=default"]
  generators:
    - list:
        elements:
          - name: hub-platform-addons
            server: https://kubernetes.default.svc
            path: clusters/platform/platform
  template:
    metadata:
      name: "{{.name}}"
      labels:
        app.kubernetes.io/component: platform-addons
        platform.rhythmx.io/environment: platform
    spec:
      project: proj-security
      source:
        repoURL: https://github.com/naveenkumar-rhythmx/platform-gitops.git
        targetRevision: main
        path: "{{.path}}"
      destination:
        server: "{{.server}}"
        namespace: security
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
