# Copy into application source repos as .github/workflows/ci.yaml
# Enterprise supply-chain pipeline: build → test → scan → SBOM → sign → push → update application-config
name: ci-supply-chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # keyless Cosign ( Fulcio )
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CONFIG_REPO: naveenkumar-rhythmx/application-config

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up language toolchain
        run: echo "Replace with setup-java / setup-node matching the service"
      - name: Unit tests
        run: echo "mvn -B test || npm test || go test ./..."

  scan-source:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: "1"

  build-push-sign:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build-test, scan-source]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=raw,value=0.1.0,enable=${{ github.ref == 'refs/heads/main' }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        run: cosign sign --yes "ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          upload-artifact: true

  update-gitops-dev:
    if: github.event_name != 'pull_request'
    needs: build-push-sign
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch image update to application-config
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PLATFORM_GITOPS_TOKEN }}
          repository: ${{ env.CONFIG_REPO }}
          event-type: image-update
          client-payload: |
            {
              "service": "${{ github.event.repository.name }}",
              "environment": "dev",
              "image": "ghcr.io/${{ env.IMAGE_NAME }}",
              "digest": "${{ needs.build-push-sign.outputs.digest }}",
              "tag": "${{ needs.build-push-sign.outputs.tag }}"
            }
