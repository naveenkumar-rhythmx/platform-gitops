# Reference static Application: ingress-nginx (dev environment example).
#
# Prefer the ApplicationSet in app-of-apps/applicationset-infrastructure.yaml
# for real deployments — it drives clusters/<env>/infrastructure/kustomization.yaml
# (which Helm-inflates this same chart via kustomize --enable-helm using
# infrastructure/ingress-nginx/values*.yaml). This file is kept as a
# hand-written REFERENCE showing the equivalent as a standalone multi-source
# Application (Helm chart + values files pulled from this Git repo), useful
# for onboarding, ad-hoc testing, or a single addon that needs to diverge
# from the ApplicationSet-managed lifecycle.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-ingress-nginx
  namespace: argocd
  labels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/instance: dev-ingress-nginx
    app.kubernetes.io/version: "1.15.1"
    app.kubernetes.io/component: ingress-controller
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
    platform.rhythmx.io/environment: dev
    platform.rhythmx.io/owner: platform-engineering
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    notifications.argoproj.io/subscribe.on-sync-failed.slack: rhythmx-platform-alerts
spec:
  project: proj-infrastructure
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targetRevision: 4.15.1 # app version 1.15.1
      helm:
        valueFiles:
          - $values/infrastructure/ingress-nginx/values.yaml
          - $values/infrastructure/ingress-nginx/values-dev.yaml
    - repoURL: https://github.com/naveenkumar-rhythmx/platform-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
      name: dev-ingress-nginx-controller
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
