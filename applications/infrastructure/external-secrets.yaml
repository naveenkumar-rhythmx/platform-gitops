# Reference static Application: external-secrets (dev environment example).
# See applications/infrastructure/ingress-nginx.yaml header for the pattern
# rationale (ApplicationSet preferred; this is a hand-written reference).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-external-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: dev-external-secrets
    app.kubernetes.io/version: "2.8.0"
    app.kubernetes.io/component: secrets-management
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
    platform.rhythmx.io/environment: dev
    platform.rhythmx.io/owner: platform-engineering
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    notifications.argoproj.io/subscribe.on-sync-failed.slack: rhythmx-platform-alerts
spec:
  project: proj-infrastructure
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.8.0
      helm:
        valueFiles:
          - $values/infrastructure/external-secrets/values.yaml
          - $values/infrastructure/external-secrets/values-dev.yaml
    - repoURL: https://github.com/naveenkumar-rhythmx/platform-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
  # ClusterSecretStore / ExternalSecret examples are applied after this
  # Application's CRDs land — see
  # infrastructure/external-secrets/cluster-secret-store.yaml (sync-wave 2).
