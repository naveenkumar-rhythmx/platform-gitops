# Reference static Application: cert-manager (dev environment example).
# See applications/infrastructure/ingress-nginx.yaml header for the pattern
# rationale (ApplicationSet preferred; this is a hand-written reference).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-cert-manager
  namespace: argocd
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/instance: dev-cert-manager
    app.kubernetes.io/version: "1.21.0"
    app.kubernetes.io/component: certificate-management
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
    platform.rhythmx.io/environment: dev
    platform.rhythmx.io/owner: platform-engineering
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    notifications.argoproj.io/subscribe.on-sync-failed.slack: rhythmx-platform-alerts
spec:
  project: proj-infrastructure
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: 1.21.0
      helm:
        valueFiles:
          - $values/infrastructure/cert-manager/values.yaml
          - $values/infrastructure/cert-manager/values-dev.yaml
    - repoURL: https://github.com/naveenkumar-rhythmx/platform-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
  # cluster-issuers.yaml (ClusterIssuer resources) are applied via
  # clusters/<env>/infrastructure/kustomization.yaml AFTER this Application's
  # sync wave (they depend on the CRDs cert-manager installs), see sync-wave
  # annotations on infrastructure/cert-manager/cluster-issuers.yaml.
