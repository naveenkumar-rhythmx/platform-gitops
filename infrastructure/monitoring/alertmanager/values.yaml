# kube-prometheus-stack values — Alertmanager sub-chart section.
# STATUS: staged, not yet applied — see ../README.md.
alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 3 # Alertmanager gossip protocol wants an odd number >= 3 in prod; 1 is fine for dev
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: slack-platform-alerts
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers:
            - severity="critical"
          receiver: pagerduty-oncall
          continue: true
    receivers:
      - name: slack-platform-alerts
        slack_configs:
          - channel: "#rhythmx-platform-alerts"
            send_resolved: true
            api_url: "$slack-webhook-url" # injected via ExternalSecret-backed Secret
      - name: pagerduty-oncall
        pagerduty_configs:
          - service_key: "$pagerduty-service-key" # injected via ExternalSecret-backed Secret
