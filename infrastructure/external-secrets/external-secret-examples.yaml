# Example ExternalSecret objects sourcing from the Kind-friendly
# `kubernetes-backend` ClusterSecretStore (see cluster-secret-store.yaml).
# Applied after that store exists (sync-wave "2"). These are illustrative —
# application teams create their own ExternalSecrets inside application-config
# overlays; these live here purely as copy-paste-able reference examples for
# onboarding.

# Step 0 (manual, one-time, per env — NOT committed to Git): seed the
# backing k8s Secret in `secrets-source` that these ExternalSecrets project
# from, e.g.:
#   kubectl -n secrets-source create secret generic db-credentials \
#     --from-literal=username=app_user \
#     --from-literal=password='<from your local secret manager, never in Git>'

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: user-service-db-credentials
  namespace: apps-user-service-dev
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/instance: user-service-db-credentials
    app.kubernetes.io/component: secret
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
    platform.rhythmx.io/environment: dev
    platform.rhythmx.io/owner: app-teams
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-backend
    kind: ClusterSecretStore
  target:
    name: user-service-db-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: user-service
          app.kubernetes.io/managed-by: external-secrets
  data:
    - secretKey: username
      remoteRef:
        key: db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: db-credentials
        property: password

---
# Example: templated Secret shaped as a connection string, combining two
# remote keys, useful when the consuming app expects a single DSN env var
# rather than discrete username/password vars.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: order-service-db-dsn
  namespace: apps-order-service-dev
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/instance: order-service-db-dsn
    app.kubernetes.io/component: secret
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
    platform.rhythmx.io/environment: dev
    platform.rhythmx.io/owner: app-teams
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-backend
    kind: ClusterSecretStore
  target:
    name: order-service-db-dsn
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@order-db.apps-database-dev.svc.cluster.local:5432/orders"
  data:
    - secretKey: username
      remoteRef:
        key: order-db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: order-db-credentials
        property: password

---
# Example: pull an entire secret's keys 1:1 via dataFrom (no per-key
# mapping needed) — useful for opaque bundles like TLS material or API key
# sets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notification-provider-api-keys
  namespace: apps-notification-dev
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/instance: notification-provider-api-keys
    app.kubernetes.io/component: secret
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
    platform.rhythmx.io/environment: dev
    platform.rhythmx.io/owner: app-teams
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-backend
    kind: ClusterSecretStore
  target:
    name: notification-provider-api-keys
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: notification-provider-api-keys

