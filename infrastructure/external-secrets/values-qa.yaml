# Effective (self-contained) external-secrets values for qa.
installCRDs: true
replicaCount: 2
webhook:
  create: true
  replicaCount: 2
certController:
  create: true
  replicaCount: 1
serviceMonitor:
  enabled: false
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 384Mi
podLabels:
  app.kubernetes.io/part-of: rhythmx-platform
  platform.rhythmx.io/environment: qa
extraArgs:
  - --concurrent-reconciles=2
