# Effective (self-contained) external-secrets values for dev/Kind.
installCRDs: true
replicaCount: 1
webhook:
  create: true
  replicaCount: 1
certController:
  create: true
  replicaCount: 1
serviceMonitor:
  enabled: false
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
podLabels:
  app.kubernetes.io/part-of: rhythmx-platform
  platform.rhythmx.io/environment: dev
extraArgs:
  - --concurrent-reconciles=1
