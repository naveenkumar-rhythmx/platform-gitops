# ClusterSecretStore(s) for external-secrets. See
# docs/architecture/secrets-management.md for the full backend comparison.
#
# Applied after the external-secrets chart installs its CRDs+webhooks (see
# sync-wave annotations patched in clusters/<env>/infrastructure/kustomization.yaml
# — ClusterSecretStore objects get wave "2", the chart itself is wave "1").
# --------------------------------------------------------------------------
# ACTIVE (Kind/dev-friendly): Kubernetes provider
# --------------------------------------------------------------------------
# Sources "external" secrets from a designated source namespace on the SAME
# cluster (`secrets-source`, created below). This has zero external
# dependencies, which is exactly what's needed to demonstrate the full
# ExternalSecret -> Secret reconciliation flow on a local Kind cluster
# without a real Vault/cloud secret manager. In qa/prod, replace this with
# (or add alongside) one of the real backends templated further below.
apiVersion: v1
kind: Namespace
metadata:
  name: secrets-source
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: secrets-source
    app.kubernetes.io/component: secrets-management
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
    platform.rhythmx.io/owner: platform-engineering
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-k8s-store-reader
  namespace: secrets-source
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: eso-k8s-store-reader
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-k8s-store-reader
  namespace: secrets-source
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-k8s-store-reader
  namespace: secrets-source
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-k8s-store-reader
subjects:
  - kind: ServiceAccount
    name: eso-k8s-store-reader
    namespace: secrets-source
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-backend
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: kubernetes-backend
    app.kubernetes.io/component: secret-store
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
    platform.rhythmx.io/owner: platform-engineering
spec:
  provider:
    kubernetes:
      remoteNamespace: secrets-source
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: secrets-source
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-k8s-store-reader
          namespace: secrets-source

