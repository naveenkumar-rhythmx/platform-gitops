# OpenTelemetry Collector values — open-telemetry/opentelemetry-collector
# chart, "deployment" mode. Vendor-neutral collection pipeline: app teams
# instrument once with the OTel SDK and export OTLP; this collector fans
# out to Tempo (traces), Loki (logs, via the loki exporter), and Prometheus
# remote-write (metrics) — swapping any backend later never requires
# re-instrumenting application code.
#
# STATUS: staged, not yet applied — see ../../monitoring/README.md.
mode: deployment

replicaCount: 1 # PROD: 2+ behind a Service for HA fan-out

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch: {}
    memory_limiter:
      check_interval: 5s
      limit_mib: 400

  exporters:
    otlp/tempo:
      endpoint: tempo.tracing.svc.cluster.local:4317
      tls:
        insecure: true
    loki:
      endpoint: http://loki-gateway.logging.svc.cluster.local/loki/api/v1/push
    prometheusremotewrite:
      endpoint: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/write

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/tempo]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [loki]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [prometheusremotewrite]

ports:
  otlp-grpc:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
