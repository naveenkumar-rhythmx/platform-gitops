# Effective (self-contained) cert-manager values for qa. 2 replicas on the
# controller for rolling-upgrade safety.
crds:
  enabled: true
replicaCount: 2
webhook:
  timeoutSeconds: 10
  replicaCount: 2
cainjector:
  replicaCount: 2
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 384Mi
prometheus:
  enabled: true
  servicemonitor:
    enabled: false
podLabels:
  app.kubernetes.io/part-of: rhythmx-platform
  platform.rhythmx.io/environment: qa
extraArgs:
  - --enable-certificate-owner-ref=true
