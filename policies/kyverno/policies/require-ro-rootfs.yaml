# Kyverno ClusterPolicy: containers must run with a read-only root
# filesystem and must not allow privilege escalation. Apps needing writable
# scratch space should mount an `emptyDir` volume rather than writing to
# the container's root filesystem.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-ro-rootfs
  labels:
    app.kubernetes.io/name: kyverno-policy
    app.kubernetes.io/instance: require-ro-rootfs
    app.kubernetes.io/component: policy
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
    platform.rhythmx.io/owner: security-architecture
  annotations:
    policies.kyverno.io/title: Require Read-Only Root Filesystem
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers must set securityContext.readOnlyRootFilesystem=true and
      allowPrivilegeEscalation=false. Use an emptyDir volume for any
      required writable scratch paths (e.g. /tmp).
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: read-only-root-filesystem
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - ingress-nginx
      validate:
        message: >-
          securityContext.readOnlyRootFilesystem must be true on every
          container. Mount an emptyDir volume for writable scratch space
          instead of relying on a writable root filesystem.
        pattern:
          spec:
            containers:
              - name: "*"
                securityContext:
                  readOnlyRootFilesystem: true
    - name: disallow-privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - ingress-nginx
      validate:
        message: "securityContext.allowPrivilegeEscalation must be false."
        pattern:
          spec:
            containers:
              - name: "*"
                securityContext:
                  allowPrivilegeEscalation: false
