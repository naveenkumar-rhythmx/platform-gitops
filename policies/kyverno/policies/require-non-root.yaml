# Kyverno ClusterPolicy: containers must not run as root (UID 0) and must
# explicitly set runAsNonRoot. Complements the namespace-level Pod Security
# Admission `restricted` label (policies/pod-security/namespace-labels.yaml)
# with Kyverno's richer messaging/exception model.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
  labels:
    app.kubernetes.io/name: kyverno-policy
    app.kubernetes.io/instance: require-non-root
    app.kubernetes.io/component: policy
    app.kubernetes.io/part-of: rhythmx-platform
    app.kubernetes.io/managed-by: argocd
    platform.rhythmx.io/owner: security-architecture
  annotations:
    policies.kyverno.io/title: Require Non-Root Containers
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers must set securityContext.runAsNonRoot=true at the pod or
      container level, and must not explicitly set runAsUser=0.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - ingress-nginx # DaemonSet controller requires elevated privilege for hostPort binding on Kind
      validate:
        message: >-
          Containers must set securityContext.runAsNonRoot=true and must
          not run as UID 0.
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
              containers:
                - name: "*"
                  =(securityContext):
                    =(runAsUser): "!0"
          - spec:
              containers:
                - name: "*"
                  securityContext:
                    runAsNonRoot: true
                    =(runAsUser): "!0"
    - name: disallow-root-uid
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - ingress-nginx
      validate:
        message: "Setting runAsUser to 0 (root) is not allowed."
        pattern:
          spec:
            =(securityContext):
              =(runAsUser): "!0"
            containers:
              - name: "*"
                =(securityContext):
                  =(runAsUser): "!0"
